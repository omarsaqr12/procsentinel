name: One-time format and smoke
on:
  push:
    branches:
      - fix/format-and-agent-smoke-20260918
permissions:
  contents: write
jobs:
  format-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-and-agent-smoke-20260918
      - name: Normalize legacy trailing whitespace
        run: find src -type f -name '*.rs' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Build process agent
        run: cargo build --locked
      - name: Live loopback agent smoke test
        run: bash scripts/ci_agent_smoke.sh
      - name: Check diff whitespace
        run: git diff --check
      - name: Remove one-time workflow and commit verified formatting
        run: |
          rm -f .github/workflows/one-time-format-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Rust sources and verify loopback agent"
          git push origin HEAD:fix/format-and-agent-smoke-20260918
