name: One-time workspace formatting
on:
  push:
    branches: [fix/rustfmt-workspace-20260918]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic rustfmt to tracked Rust sources
        run: cargo fmt --all
      - name: Validate workspace formatting and diff
        run: |
          cargo fmt --all -- --check
          git diff --check
          git diff --stat
          git diff --name-only | grep -E '^src/.*\.rs$' >/dev/null
          if git diff --name-only | grep -Ev '^src/.*\.rs$'; then
            echo 'Unexpected non-source file changed' >&2
            exit 1
          fi
      - name: Commit only formatted Rust sources to this branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = fix/rustfmt-workspace-20260918
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/
          git commit -m 'style: format Rust source consistently with cargo fmt'
          git push origin HEAD:"$GITHUB_REF_NAME"
