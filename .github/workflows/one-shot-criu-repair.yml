name: One-time CRIU security repair
on:
  push:
    branches: [fix/criu-checkpoint-boundaries-20260918]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline-checked checkpoint safety patch
        run: python3 .github/criu_safety_once.py
      - name: Fix metadata representation and add serialization regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/criu_manager.rs')
          s = p.read_text()
          def replace_exact(old, new):
              global s
              assert s.count(old) == 1, f'Expected unique anchor: {old!r}, found {s.count(old)}'
              s = s.replace(old, new, 1)
          replace_exact('                let mut checkpoint_id = None;', '                let mut checkpoint_id: Option<String> = None;')
          replace_exact('    pub created_at: SystemTime,', '    #[serde(skip_serializing)]\n    pub created_at: SystemTime,')
          replace_exact('pub struct CriuManager {', '''#[derive(Serialize, Deserialize)]
          struct CheckpointListFile {
              checkpoints: Vec<CheckpointInfo>,
          }

          pub struct CriuManager {''')
          replace_exact('if let Ok(mut metadata_list) = toml::from_str::<Vec<CheckpointInfo>>(&content) {', '''if let Ok(mut metadata_list) = toml::from_str::<CheckpointListFile>(&content)
                      .map(|file| file.checkpoints)
                      .or_else(|_| toml::from_str::<Vec<CheckpointInfo>>(&content))
                  {''')
          replace_exact('let content = toml::to_string_pretty(checkpoints)', 'let content = toml::to_string_pretty(&CheckpointListFile { checkpoints: checkpoints.to_vec() })')
          old = '    #[test]\n    fn pidfile_requires_a_positive_pid_in_regular_file() {'
          test = '''    #[test]
              fn metadata_roundtrip_and_delete_persist_consistently() {
                  let manager = disposable_manager();
                  let dir = manager.checkpoint_base_dir.join("checkpoint_metadata");
                  std::fs::create_dir(&dir).unwrap();
                  let now = SystemTime::now();
                  let secs = now.duration_since(UNIX_EPOCH).unwrap().as_secs();
                  let info = CheckpointInfo {
                      checkpoint_id: "checkpoint_metadata".to_string(),
                      pid: 123,
                      process_name: "disposable".to_string(),
                      checkpoint_dir: dir.clone(),
                      created_at: now,
                      created_at_secs: secs,
                      metadata: None,
                  };
                  manager.save_all_checkpoints_metadata(&[info]).unwrap();
                  let restored = manager.list_checkpoints();
                  assert_eq!(restored.len(), 1);
                  assert_eq!(restored[0].pid, 123);
                  manager.delete_checkpoint("checkpoint_metadata").unwrap();
                  assert!(!dir.exists());
                  assert!(manager.list_checkpoints().is_empty());
                  std::fs::remove_dir_all(manager.checkpoint_base_dir).unwrap();
              }

          '''
          replace_exact(old, test + old)
          p.write_text(s)
          PY
      - name: Format only the modified module
        run: rustfmt --edition 2024 src/criu_manager.rs
      - name: Check resulting patch
        run: git diff --check && git diff --stat
      - name: Compile
        run: cargo check --locked
      - name: Unit tests (including disposable checkpoint security tests)
        run: cargo test --locked
      - name: Commit only verified CRIU source to this feature branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = fix/criu-checkpoint-boundaries-20260918
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/criu_manager.rs
          git commit -m 'fix: confine checkpoint paths and persist safe metadata'
          git push origin HEAD:"$GITHUB_REF_NAME"
